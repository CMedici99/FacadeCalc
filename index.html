<script>

let dxfContent = "";

function loadDXF() {

    const fileInput =
        document.getElementById("dxfFile");

    const status =
        document.getElementById("dxfStatus");

    const loadStatus =
        document.getElementById("dxfLoadStatus");

    if (!fileInput || fileInput.files.length === 0) {

        status.innerHTML =
            "No DXF selected";

        loadStatus.innerHTML =
            "DXF not loaded";

        return;
    }

    const file =
        fileInput.files[0];

    status.innerHTML =
        "Selected: " +
        file.name +
        " (" +
        file.size.toLocaleString() +
        " bytes)";

    loadStatus.innerHTML =
        "Loading DXF...";

    const reader =
        new FileReader();

    reader.onload = function(event) {

        dxfContent =
            event.target.result;

        const lines =
            dxfContent.split(/\r?\n/);

        const upperDXF =
            dxfContent.toUpperCase();

        const hasTables =
            upperDXF.includes("TABLES");

        const hasEntities =
            upperDXF.includes("ENTITIES");

        const layerMatches =
            upperDXF.match(/\bLAYER\b/g);

        const layerCount =
            layerMatches
                ? layerMatches.length
                : 0;

        loadStatus.innerHTML =

            "DXF Loaded Successfully<br>" +

            "Line Count = " +
            lines.length +

            "<br><br>" +

            "TABLES: " +
            (hasTables ? "YES" : "NO") +

            "<br>" +

            "ENTITIES: " +
            (hasEntities ? "YES" : "NO") +

            "<br>" +

            "Layer References: " +
            layerCount;
    };

    reader.onerror = function() {

        loadStatus.innerHTML =
            "DXF Read Failed";

    };

    reader.readAsText(file);
}

function calculate() {

    const width =
        Number(document.getElementById("width").value);

    const height =
        Number(document.getElementById("height").value);

    const area =
        (width / 1000) *
        (height / 1000);

    const wind =
        Number(document.getElementById("wind").value);

    const density =
        Number(document.getElementById("density").value);

    const totalWind =
        area * wind;

    const totalDead =
        area * density * 9.81 / 1000;

    document.getElementById("results").innerHTML =

        "<h2>Summary</h2>" +

        "<table>" +

        "<tr><td>Area</td><td>" +
        area.toFixed(3) +
        " m²</td></tr>" +

        "<tr><td>Total Wind Load</td><td>" +
        totalWind.toFixed(3) +
        " kN</td></tr>" +

        "<tr><td>Total Dead Load</td><td>" +
        totalDead.toFixed(3) +
        " kN</td></tr>" +

        "</table>";
}

</script>
