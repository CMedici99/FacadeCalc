<script>

let dxfContent = "";

function loadDXF() {

    const fileInput = document.getElementById("dxfFile");
    const status = document.getElementById("dxfStatus");
    const loadStatus = document.getElementById("dxfLoadStatus");

    if (!fileInput.files.length) {
        status.textContent = "No DXF selected";
        loadStatus.textContent = "DXF not loaded";
        return;
    }

    const file = fileInput.files[0];

    status.textContent =
        file.name +
        " (" +
        file.size.toLocaleString() +
        " bytes)";

    loadStatus.textContent = "Loading DXF...";

    const reader = new FileReader();

    reader.onload = function (event) {

        dxfContent = event.target.result;

        const lines =
            dxfContent.split(/\r\n|\n|\r/);

        const layers = new Set();

        for (let i = 0; i < lines.length - 1; i++) {

            if (lines[i].trim() === "8") {

                const layerName =
                    lines[i + 1].trim();

                if (layerName.length > 0) {
                    layers.add(layerName);
                }
            }
        }

        const layerList =
            Array.from(layers).sort();

        loadStatus.innerHTML =
            "<strong>DXF Loaded Successfully</strong>" +
            "<br>" +
            "Line Count: " +
            lines.length +
            "<br>" +
            "Layer Count: " +
            layerList.length +
            "<br><br>" +
            layerList.join("<br>");
    };

    reader.onerror = function () {
        loadStatus.textContent =
            "DXF Read Failed";
    };

    reader.readAsText(file);
}
