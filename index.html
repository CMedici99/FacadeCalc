<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FacadeCalc v0.6.0</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

.section{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:8px;
}

label{
    display:inline-block;
    width:220px;
}

input{
    padding:6px;
    width:160px;
}

button{
    padding:10px 20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

td{
    border:1px solid #ccc;
    padding:8px;
}

</style>

</head>

<body>

<div class="section">

<h1>FacadeCalc v0.6.0</h1>

<p>
Validated TN14 Calculator
</p>

</div>

<div class="section">

<h2>DXF Upload</h2>

<input
    type="file"
    id="dxfFile"
    accept=".dxf"
>

<button onclick="loadDXF()">
Load DXF
</button>

<p id="dxfStatus">

No DXF selected

</p>

<p id="dxfLoadStatus">

DXF not loaded

</p>

</div>

<div class="section">

<h2>Geometry</h2>

<p>
<label>Panel Width (mm)</label>
<input id="width" value="1000">
</p>

<p>
<label>Panel Height (mm)</label>
<input id="height" value="2029">
</p>

<p>
<label>DL Support Level (mm)</label>
<input id="dl" value="1846">
</p>

<p>
<label>RS Support Level (mm)</label>
<input id="rs" value="337.5">
</p>

<p>
<label>Barrier Height (mm)</label>
<input id="bh" value="1100">
</p>

</div>

<div class="section">

<h2>Loads</h2>

<p>
<label>Wind Pressure (kPa)</label>
<input id="wind" value="2">
</p>

<p>
<label>Density (kg/m²)</label>
<input id="density" value="50">
</p>

<p>
<label>Barrier Load (kN)</label>
<input id="barrier" value="1">
</p>

</div>

<div class="section">

<button onclick="calculate()">
Calculate
</button>

</div>

<div class="section">

<div id="results">
Press Calculate
</div>

</div>

<script>

let dxfContent = "";

function loadDXF(){

    const fileInput =
        document.getElementById("dxfFile");

    if(fileInput.files.length === 0){

        document.getElementById(
            "dxfStatus"
        ).innerHTML =
            "No DXF selected";

        return;
    }

    const file =
        fileInput.files[0];

    document.getElementById(
        "dxfStatus"
    ).innerHTML =

        "Selected: "
        + file.name
        + " ("
        + file.size.toLocaleString()
        + " bytes)";

    const reader =
        new FileReader();

reader.onload = function(event){

    dxfContent =
        event.target.result;

    const lines =
        dxfContent.split(/\r?\n/);

    document.getElementById(
        "dxfLoadStatus"
    ).innerHTML =

        "DXF Loaded Successfully<br>" +
        "Line Count = " +
        lines.length;


    };

    reader.readAsText(file);

}

function calculate(){

    const width =
        Number(document.getElementById("width").value);

    const height =
        Number(document.getElementById("height").value);

    const area =
        (width / 1000) *
        (height / 1000);

    const wind =
        Number(document.getElementById("wind").value);

    const density =
        Number(document.getElementById("density").value);

    const totalWind =
        area * wind;

    const totalDead =
        area * density * 9.81 / 1000;

    document.getElementById(
        "results"
    ).innerHTML =

        "<h2>Summary</h2>" +

        "<table>" +

        "<tr><td>Area</td><td>"
        + area.toFixed(3)
        + " m²</td></tr>" +

        "<tr><td>Total Wind Load</td><td>"
        + totalWind.toFixed(3)
        + " kN</td></tr>" +

        "<tr><td>Total Dead Load</td><td>"
        + totalDead.toFixed(3)
        + " kN</td></tr>" +

        "</table>";
}

</script>

</body>
</html>
