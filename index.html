<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const fileInput =
            document.getElementById(
                "dxfFile"
            );

        if(fileInput){

            fileInput.addEventListener(
                "change",
                function(){

                    if(
                        this.files.length > 0
                    ){

                        document.getElementById(
                            "dxfStatus"
                        ).innerHTML =

                        "Selected: "
                        +
                        this.files[0].name;

                    }

                }
            );

        }

    }
);

function calculate(){

    const width = Number(document.getElementById("width").value);
    const height = Number(document.getElementById("height").value);
    const dl = Number(document.getElementById("dl").value);
    const rs = Number(document.getElementById("rs").value);
    const bh = Number(document.getElementById("bh").value);

    const wind = Number(document.getElementById("wind").value);
    const density = Number(document.getElementById("density").value);
    const barrier = Number(document.getElementById("barrier").value);

    const area =
        (width / 1000) *
        (height / 1000);

    const totalWind =
        area * wind;

    const totalDead =
        area * density * 9.81 / 1000;

    const spacing =
        (dl - rs) / 1000;

    const cg =
        (height / 1000) / 2;

    const topReaction =
        totalWind *
        (cg - rs/1000) /
        spacing;

    const bottomReaction =
        totalWind -
        topReaction;

    const barrierTop =
        barrier *
        ((bh/1000) - (rs/1000)) /
        spacing;

    const barrierBottom =
        barrier - barrierTop;

    const y = 0.175;
    const zi = 0.065;
    const d = 0.065;
    const e = 0.055;

    const denominator =
        (2 * e + d);

    const deadBracket =
        (totalDead / 2) * 1.35;

    const upperWindR2 =
        (
            deadBracket * zi +
            ((topReaction / 2) * 1.5) *
            (y/2 + e)
        )
        /
        denominator;

    const upperWindR1 =
        ((topReaction / 2) * 1.5)
        -
        upperWindR2;

    const lowerWindR2 =
        (
            ((bottomReaction / 2) * 1.5)
            *
            (y/2 + e)
        )
        /
        denominator;

    const lowerWindR1 =
        ((bottomReaction / 2) * 1.5)
        -
        lowerWindR2;

    const upperBarrierR2 =
        (
            deadBracket * zi +
            ((barrierTop / 2) * 1.5)
            *
            (y/2 + e)
        )
        /
        denominator;

    const upperBarrierR1 =
        ((barrierTop / 2) * 1.5)
        -
        upperBarrierR2;

    const lowerBarrierR2 =
        (
            ((barrierBottom / 2) * 1.5)
            *
            (y/2 + e)
        )
        /
        denominator;

    const lowerBarrierR1 =
        ((barrierBottom / 2) * 1.5)
        -
        lowerBarrierR2;

    const checks = [
        ["Wind + Dead","Upper","R1",Math.abs(upperWindR1)],
        ["Wind + Dead","Upper","R2",Math.abs(upperWindR2)],
        ["Wind + Dead","Lower","R1",Math.abs(lowerWindR1)],
        ["Wind + Dead","Lower","R2",Math.abs(lowerWindR2)],
        ["Barrier + Dead","Upper","R1",Math.abs(upperBarrierR1)],
        ["Barrier + Dead","Upper","R2",Math.abs(upperBarrierR2)],
        ["Barrier + Dead","Lower","R1",Math.abs(lowerBarrierR1)],
        ["Barrier + Dead","Lower","R2",Math.abs(lowerBarrierR2)]
    ];

    checks.sort((a,b)=>b[3]-a[3]);

    const governing = checks[0];

    document.getElementById("results").innerHTML = `

    <h2>Summary</h2>

    <table>
        <tr><td>Area</td><td>${area.toFixed(3)} m²</td></tr>
        <tr><td>Support Spacing</td><td>${(spacing*1000).toFixed(1)} mm</td></tr>
        <tr><td>Total Wind Load</td><td>${totalWind.toFixed(3)} kN</td></tr>
        <tr><td>Total Dead Load</td><td>${totalDead.toFixed(3)} kN</td></tr>
    </table>

    <h2>Wind + Dead</h2>

    <table>
        <tr><td>Upper R1</td><td>${upperWindR1.toFixed(3)} kN</td></tr>
        <tr><td>Upper R2</td><td>${upperWindR2.toFixed(3)} kN</td></tr>
        <tr><td>Lower R1</td><td>${lowerWindR1.toFixed(3)} kN</td></tr>
        <tr><td>Lower R2</td><td>${lowerWindR2.toFixed(3)} kN</td></tr>
    </table>

    <h2>Barrier + Dead</h2>

    <table>
        <tr><td>Upper R1</td><td>${upperBarrierR1.toFixed(3)} kN</td></tr>
        <tr><td>Upper R2</td><td>${upperBarrierR2.toFixed(3)} kN</td></tr>
        <tr><td>Lower R1</td><td>${lowerBarrierR1.toFixed(3)} kN</td></tr>
        <tr><td>Lower R2</td><td>${lowerBarrierR2.toFixed(3)} kN</td></tr>
    </table>

    <div class="governing">
        <h2>Governing Result</h2>

        <p><strong>Load Case:</strong> ${governing[0]}</p>
        <p><strong>Bracket:</strong> ${governing[1]}</p>
        <p><strong>Fixing:</strong> ${governing[2]}</p>
        <p><strong>Force:</strong> ${[2governing[3].toFixed(3)}N</p>
    </div>

    `;
}

</script>
