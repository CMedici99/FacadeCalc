<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>FacadeCalc v0.6.0 dxf import working</title>

<style>

body{
    font-family: Segoe UI, Arial, sans-serif;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
    background: #f5f5f5;
}

.section{
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
}

label{
    display: inline-block;
    width: 220px;
}

input{
    width: 160px;
    padding: 6px;
}

button{
    padding: 10px 20px;
    background: #0078d4;
    color: white;
    border: none;
    cursor: pointer;
}

table{
    width: 100%;
    border-collapse: collapse;
}

td{
    border: 1px solid #cccccc;
    padding: 8px;
}

</style>

</head>

<body>

<div class="section">
<h1>FacadeCalc v0.6.0</h1>
<p>Validated TN14 Calculator + DXF Reader</p>
</div>

<div class="section">

<h2>DXF Upload</h2>

<input
    type="file"
    id="dxfFile"
    accept=".dxf"
>

<button onclick="loadDXF()">
Load DXF
</button>

<p id="dxfStatus">
No DXF selected
</p>

<p id="dxfLoadStatus">
DXF not loaded
</p>

</div>

<div class="section">

<h2>Geometry</h2>

<p><label>Panel Width (mm)</label><input id="width" value="1000"></p>
<p><label>Panel Height (mm)</label><input id="height" value="2029"></p>
<p><label>DL Support Level (mm)</label><input id="dl" value="1846"></p>
<p><label>RS Support Level (mm)</label><input id="rs" value="337.5"></p>
<p><label>Barrier Height (mm)</label><input id="bh" value="1100"></p>

</div>

<div class="section">

<h2>Loads</h2>

<p><label>Wind Pressure (kPa)</label><input id="wind" value="2"></p>
<p><label>Density (kg/m²)</label><input id="density" value="50"></p>
<p><label>Barrier Load (kN)</label><input id="barrier" value="1"></p>

</div>

<div class="section">

<button onclick="calculate()">
Calculate
</button>

</div>

<div class="section">

<div id="results">
Press Calculate
</div>

</div>

<script>

let dxfContent = "";

function loadDXF() {

    const fileInput =
        document.getElementById("dxfFile");

    const dxfStatus =
        document.getElementById("dxfStatus");

    const dxfLoadStatus =
        document.getElementById("dxfLoadStatus");

    if (!fileInput.files.length) {

        dxfStatus.textContent =
            "No DXF selected";

        dxfLoadStatus.textContent =
            "DXF not loaded";

        return;
    }

    const file =
        fileInput.files[0];

    dxfStatus.textContent =
        file.name +
        " (" +
        file.size.toLocaleString() +
        " bytes)";

    dxfLoadStatus.textContent =
        "Loading DXF...";

    const reader =
        new FileReader();

      reader.onload = function(event){

    dxfContent =
        event.target.result;

const lines =
    dxfContent.split(/\r\n|\n|\r/);

for(let i = 0; i < lines.length - 1; i++){

    if(lines[i].trim() === "LWPOLYLINE"){

        alert(
            lines.slice(
                i,
                i + 80
            ).join("\n")
        );

        break;
    }
}
          
const dlPoints = [];
const rsPoints = [];
const brPoints = [];

          let panelWidth = 0;
let panelHeight = 0;

for(let i = 0; i < lines.length - 1; i++){

    if(
        lines[i].trim() === "LWPOLYLINE"
    ){

        let panelFound = false;
        let xCoords = [];
        let yCoords = [];

        for(
            let j = i;
            j < i + 200 && j < lines.length - 1;
            j++
        ){

            if(
                lines[j].trim() === "8" &&
                lines[j + 1].trim() === "PANEL_GEOMETRY"
            ){
                panelFound = true;
            }

            if(
                panelFound &&
                lines[j].trim() === "10"
            ){

                xCoords.push(
                    Number(lines[j + 1])
                );
            }

            if(
                panelFound &&
                lines[j].trim() === "20"
            ){

                yCoords.push(
                    Number(lines[j + 1])
                );
            }
        }

        if(
            panelFound &&
            xCoords.length > 0 &&
            yCoords.length > 0
        ){

            const xmin =
                Math.min(...xCoords);

            const xmax =
                Math.max(...xCoords);

            const ymin =
                Math.min(...yCoords);

            const ymax =
                Math.max(...yCoords);

            panelWidth =
                xmax - xmin;

            panelHeight =
                ymax - ymin;

            break;
        }
    }
}

for(let i = 0; i < lines.length - 10; i++){

    if(lines[i].trim() !== "INSERT"){
        continue;
    }

    let block = "";
    let y = 0;

    for(let j = i; j < i + 40 && j < lines.length - 1; j++){

        const code =
            lines[j].trim();

        const value =
            lines[j + 1].trim();

        if(code === "2"){
            block = value;
        }

        if(code === "20"){
            y = Number(value);
        }
    }

    if(block === "DL"){
        dlPoints.push(y);
    }

    if(block === "RS"){
        rsPoints.push(y);
    }

    if(block === "BR"){
        brPoints.push(y);
    }
}

const dlLevel =
    dlPoints.length
        ? Math.max(...dlPoints)
        : 0;

const rsLevel =
    rsPoints.length
        ? Math.min(...rsPoints)
        : 0;

const barrierHeight =
    brPoints.length
        ? brPoints[0]
        : 0;
alert(
    "DL=" + dlLevel +
    "\nRS=" + rsLevel +
    "\nBR=" + barrierHeight
);

          
if(dlLevel > 0){

    document.getElementById("dl").value =
        dlLevel.toFixed(1);
}

if(rsLevel > 0){

    document.getElementById("rs").value =
        rsLevel.toFixed(1);
}

if(panelWidth > 0){

    document.getElementById("width").value =
        panelWidth.toFixed(0);
}

if(panelHeight > 0){

    document.getElementById("height").value =
        panelHeight.toFixed(0);
}

alert(
    "Width = " + panelWidth +
    "\nHeight = " + panelHeight
);
          
if(barrierHeight > 0){

    document.getElementById("bh").value =
        barrierHeight.toFixed(1);
}

const layers =
    new Set();

    for(let i = 0; i < lines.length - 1; i++){

        if(lines[i].trim() === "8"){

            const layerName =
                lines[i + 1].trim();

            if(layerName){
                layers.add(layerName);
            }
        }
    }
   const layerList =
    Array.from(layers).sort();

const panelLayer =
    layerList.includes("PANEL_GEOMETRY")
        ? "PANEL_GEOMETRY"
        : "Not Found";

const deadloadLayer =
    layerList.includes("DEADLOAD")
        ? "DEADLOAD"
        : "Not Found";

const restrainLayer =
    layerList.includes("RESTRAIN")
        ? "RESTRAIN"
        : "Not Found";

const barrierLayer =
    layerList.includes("BARRIER")
        ? "BARRIER"
        : "Not Found";

dxfLoadStatus.innerHTML =
    "<strong>DXF Loaded Successfully</strong><br><br>" +

    "Line Count: " + lines.length +

    "<br>" +

    "Layer Count: " + layerList.length +

    "<br><br>" +

    "<strong>Detected Layers</strong><br>" +

    "Panel: " + panelLayer +

    "<br>" +

    "Deadload: " + deadloadLayer +

    "<br>" +

    "Restrain: " + restrainLayer +

    "<br>" +

    "Barrier: " + barrierLayer +

    "<br><br>" +

    "<strong>All Layers</strong><br>" +

    layerList.join("<br>");
       
    };

    reader.onerror = function(){

        dxfLoadStatus.textContent =
            "DXF Read Failed";

    };

    reader.readAsText(file);
}

function calculate(){

    const width =
        Number(document.getElementById("width").value);

    const height =
        Number(document.getElementById("height").value);

    const dl =
        Number(document.getElementById("dl").value);

    const rs =
        Number(document.getElementById("rs").value);

    const bh =
        Number(document.getElementById("bh").value);

    const wind =
        Number(document.getElementById("wind").value);

    const density =
        Number(document.getElementById("density").value);

    const barrier =
        Number(document.getElementById("barrier").value);

    const area =
        (width / 1000) *
        (height / 1000);

    const totalWind =
        area * wind;

    const totalDead =
        area * density * 9.81 / 1000;

    const spacing =
        (dl - rs) / 1000;

    const cg =
        (height / 1000) / 2;

    const topReaction =
        totalWind *
        ((cg - rs / 1000) / spacing);

    const bottomReaction =
        totalWind -
        topReaction;

    const barrierTop =
        barrier *
        (((bh / 1000) - (rs / 1000)) / spacing);

    const barrierBottom =
        barrier -
        barrierTop;

    const y = 0.175;
    const zi = 0.065;
    const d = 0.065;
    const e = 0.055;

    const denominator =
        (2 * e + d);

    const deadBracket =
        (totalDead / 2) * 1.35;

    const upperWindR2 =
        (
            deadBracket * zi +
            ((topReaction / 2) * 1.5) *
            (y / 2 + e)
        ) / denominator;

    const upperWindR1 =
        ((topReaction / 2) * 1.5) -
        upperWindR2;

    const lowerWindR2 =
        (
            ((bottomReaction / 2) * 1.5) *
            (y / 2 + e)
        ) / denominator;

    const lowerWindR1 =
        ((bottomReaction / 2) * 1.5) -
        lowerWindR2;

    const upperBarrierR2 =
        (
            deadBracket * zi +
            ((barrierTop / 2) * 1.5) *
            (y / 2 + e)
        ) / denominator;

    const upperBarrierR1 =
        ((barrierTop / 2) * 1.5) -
        upperBarrierR2;

    const lowerBarrierR2 =
        (
            ((barrierBottom / 2) * 1.5) *
            (y / 2 + e)
        ) / denominator;

    const lowerBarrierR1 =
        ((barrierBottom / 2) * 1.5) -
        lowerBarrierR2;

   document.getElementById("results").innerHTML = `

<h2>Summary</h2>

<table>
    <tr>
        <td>Area</td>
        <td>${area.toFixed(3)} m²</td>
    </tr>

    <tr>
        <td>Support Spacing</td>
        <td>${(spacing * 1000).toFixed(1)} mm</td>
    </tr>

    <tr>
        <td>Total Wind Load</td>
        <td>${totalWind.toFixed(3)} kN</td>
    </tr>

    <tr>
        <td>Total Dead Load</td>
        <td>${totalDead.toFixed(3)} kN</td>
    </tr>
</table>

<h2>Wind + Dead</h2>

<table>
    <tr>
        <td>Upper R1</td>
        <td>${upperWindR1.toFixed(3)} kN</td>
    </tr>

    <tr>
        <td>Upper R2</td>
        <td>${upperWindR2.toFixed(3)} kN</td>
    </tr>

    <tr>
        <td>Lower R1</td>
        <td>${lowerWindR1.toFixed(3)} kN</td>
    </tr>

    <tr>
        <td>Lower R2</td>
        <td>${lowerWindR2.toFixed(3)} kN</td>
    </tr>
</table>

<h2>Barrier + Dead</h2>

<table>
    <tr>
        <td>Upper R1</td>
        <td>${upperBarrierR1.toFixed(3)} kN</td>
    </tr>

    <tr>
        <td>Upper R2</td>
        <td>${upperBarrierR2.toFixed(3)} kN</td>
    </tr>

    <tr>
        <td>Lower R1</td>
        <td>${lowerBarrierR1.toFixed(3)} kN</td>
    </tr>

    <tr>
        <td>Lower R2</td>
        <td>${lowerBarrierR2.toFixed(3)} kN</td>
    </tr>
</table>

`;
}

</script>

</body>
</html>
