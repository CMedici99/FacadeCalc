<script>

let dxfContent = "";

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const fileInput =
            document.getElementById(
                "dxfFile"
            );

        if(fileInput){

            fileInput.addEventListener(
                "change",
                function(){

                    if(
                        this.files.length === 0
                    ){
                        return;
                    }

                    const file =
                        this.files[0];

                    document.getElementById(
                        "dxfStatus"
                    ).innerHTML =
                        "Selected: " +
                        file.name;

                    const reader =
                        new FileReader();

                    reader.onload =
                        function(event){

                            dxfContent =
                                event.target.result;

                            document.getElementById(
                                "dxfInfo"
                            ).innerHTML =
                                "Loaded " +
                                file.size.toLocaleString() +
                                " bytes";

                        };

                    reader.readAsText(file);

                }
            );

        }

    }
);

function calculate(){

    const width =
        Number(document.getElementById("width").value);

    const height =
        Number(document.getElementById("height").value);

    const dl =
        Number(document.getElementById("dl").value);

    const rs =
        Number(document.getElementById("rs").value);

    const bh =
        Number(document.getElementById("bh").value);

    const wind =
        Number(document.getElementById("wind").value);

    const density =
        Number(document.getElementById("density").value);

    const barrier =
        Number(document.getElementById("barrier").value);

    const area =
        (width / 1000) *
        (height / 1000);

    const totalWind =
        area * wind;

    const totalDead =
        area * density * 9.81 / 1000;

    const spacing =
        (dl - rs) / 1000;

    const cg =
        (height / 1000) / 2;

    const topReaction =
        totalWind *
        (cg - rs / 1000) /
        spacing;

    const bottomReaction =
        totalWind -
        topReaction;

    const barrierTop =
        barrier *
        ((bh / 1000) - (rs / 1000)) /
        spacing;

    const barrierBottom =
        barrier - barrierTop;

    const y = 0.175;
    const zi = 0.065;
    const d = 0.065;
    const e = 0.055;

    const denominator =
        (2 * e + d);

    const deadBracket =
        (totalDead / 2) * 1.35;

    const upperWindR2 =
        (
            deadBracket * zi +
            ((topReaction / 2) * 1.5) *
            (y / 2 + e)
        ) / denominator;

    const upperWindR1 =
        ((topReaction / 2) * 1.5)
        - upperWindR2;

    const lowerWindR2 =
        (
            ((bottomReaction / 2) * 1.5) *
            (y / 2 + e)
        ) / denominator;

    const lowerWindR1 =
        ((bottomReaction / 2) * 1.5)
        - lowerWindR2;

    const upperBarrierR2 =
        (
            deadBracket * zi +
            ((barrierTop / 2) * 1.5) *
            (y / 2 + e)
        ) / denominator;

    const upperBarrierR1 =
        ((barrierTop / 2) * 1.5)
        - upperBarrierR2;

    const lowerBarrierR2 =
        (
            ((barrierBottom / 2) * 1.5) *
            (y / 2 + e)
        ) / denominator;

    const lowerBarrierR1 =
        ((barrierBottom / 2) * 1.5)
        - lowerBarrierR2;

   const checks = [

    ["Wind + Dead","Upper","R1", Math.abs(upperWindR1)],
    ["Wind + Dead","Upper","R2", Math.abs(upperWindR2)],
    ["Wind + Dead","Lower","R1", Math.abs(lowerWindR1)],
    ["Wind + Dead","Lower","R2", Math.abs(lowerWindR2)],

    ["Barrier + Dead","Upper","R1", Math.abs(upperBarrierR1)],
    ["Barrier + Dead","Upper","R2", Math.abs(upperBarrierR2)],
    ["Barrier + Dead","Lower","R1", Math.abs(lowerBarrierR1)],
    ["Barrier + Dead","Lower","R2", Math.abs(lowerBarrierR2)]

];


    </script>
