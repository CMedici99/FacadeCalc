<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FacadeCalc</title>

    <style>
        body{
            font-family:Segoe UI, Arial, sans-serif;
            max-width:1200px;
            margin:auto;
            padding:20px;
            background:#f5f5f5;
        }

        .section{
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:8px;
        }

        input{
            padding:8px;
            width:150px;
        }

        label{
            display:inline-block;
            width:220px;
        }

        h1{
            color:#0078d4;
        }
    </style>
</head>

<body>

<div class="section">

    <h1>FacadeCalc v0.5.0</h1>

    <p>
        CWCT TN14 Facade Support Calculator
    </p>

</div>

<div class="section">

    <h2>Geometry</h2>

    <p>
        <label>Panel Width (mm)</label>
        <input id="width" value="1000">
    </p>

    <p>
        <label>Panel Height (mm)</label>
        <input id="height" value="2029">
    </p>

    <p>
        <label>DL Support Level (mm)</label>
        <input id="dl" value="1846">
    </p>

    <p>
        <label>RS Support Level (mm)</label>
        <input id="rs" value="337.5">
    </p>

    <p>
        <label>Barrier Height (mm)</label>
        <input id="bh" value="1100">
    </p>

</div>

<div class="section">

    <h2>Loads</h2>

    <p>
        <label>Wind Pressure (kPa)</label>
        <input id="wind" value="2">
    </p>

    <p>
        <label>Density (kg/m²)</label>
        <input id="density" value="50">
    </p>

    <p>
        <label>Barrier Load (kN)</label>
        <input id="barrier" value="1">
    </p>

</div>

<div class="section">

    <button onclick="calculate()">
        Calculate
    </button>

</div>

<div class="section">

    <h2>Results</h2>

    <div id="results">

        Press Calculate

    </div>

</div>

<script>

function calculate(){

    const width =
        Number(
            document.getElementById("width").value
        );

    const height =
        Number(
            document.getElementById("height").value
        );

    const dl =
        Number(
            document.getElementById("dl").value
        );

    const rs =
        Number(
            document.getElementById("rs").value
        );

    const wind =
        Number(
            document.getElementById("wind").value
        );

    const density =
        Number(
            document.getElementById("density").value
        );

    const area =
        (width / 1000)
        *
        (height / 1000);

    const spacing =
        dl - rs;

    const totalWind =
        area * wind;

    const totalDead =
        area * density * 9.81 / 1000;

    document.getElementById(
        "results"
    ).innerHTML = `

        <h2>Summary</h2>

        <p>
            Area:
            ${area.toFixed(3)} m²
        </p>

        <p>
            Support Spacing:
            ${spacing.toFixed(1)} mm
        </p>

        <p>
            Total Wind Load:
            ${totalWind.toFixed(3)} kN
        </p>

        <p>
            Total Dead Load:
            ${totalDead.toFixed(3)} kN
        </p>

     `;
}

</script>

</body>
</html>
