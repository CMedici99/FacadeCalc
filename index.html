<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FacadeCalc v0.5.1</title>

<style>
body{
    font-family:Segoe UI, Arial, sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

.section{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:8px;
}

input{
    padding:8px;
    width:160px;
}

label{
    display:inline-block;
    width:250px;
}

button{
    padding:10px 20px;
    background:#0078d4;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#f0f0f0;
}

.governing{
    background:#e8f5e9;
    padding:15px;
    border-radius:6px;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="section">
    <h1>FacadeCalc v0.5.1</h1>
    <p>CWCT TN14 Facade Support Calculator</p>
</div>

<div class="section">

<h2>Geometry</h2>

<p>
<label>Panel Width (mm)</label>
<input id="width" value="1000">
</p>

<p>
<label>Panel Height (mm)</label>
<input id="height" value="2029">
</p>

<p>
<label>DL Support Level (mm)</label>
<input id="dl" value="1846">
</p>

<p>
<label>RS Support Level (mm)</label>
<input id="rs" value="337.5">
</p>

<p>
<label>Barrier Height (mm)</label>
<input id="bh" value="1100">
</p>

<pre>
DL1 ---------------- DL2

|                    |

|       PANEL        |

|                    |

RS1 ---------------- RS2
</pre>

</div>
